services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: perception_db
      POSTGRES_USER: perception
      POSTGRES_PASSWORD: changeme
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U perception -d perception_db"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DJANGO_SECRET_KEY: dev-secret-key-change-in-production
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
      POSTGRES_DB: perception_db
      POSTGRES_USER: perception
      POSTGRES_PASSWORD: changeme
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    volumes:
      - media_data:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn perception_backend.wsgi:application --bind 0.0.0.0:8000 --workers 3"

  worker:
    build: ./worker
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      YOLO_MODEL_SIZE: yolov8m
      DETECTION_CONFIDENCE_THRESHOLD: "0.25"
      CLASSIFICATION_CONFIDENCE_THRESHOLD: "0.15"
      MAX_DETECTIONS_PER_IMAGE: "50"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - model_cache:/root/.cache
      - media_data:/app/media

  # GPU worker variant (use with: docker compose --profile gpu up)
  worker-gpu:
    build: ./worker
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      YOLO_MODEL_SIZE: yolov8m
      DETECTION_CONFIDENCE_THRESHOLD: "0.25"
      CLASSIFICATION_CONFIDENCE_THRESHOLD: "0.15"
      MAX_DETECTIONS_PER_IMAGE: "50"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - model_cache:/root/.cache
      - media_data:/app/media
    profiles:
      - gpu
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  postgres_data:
  model_cache:
  media_data:
